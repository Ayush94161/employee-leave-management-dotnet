services:
  leave-api:
    build: .
    image: leave-management-api:latest
    container_name: leave-management-api

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/app/data/leave-management.db"
      Jwt__Key: "${JWT_KEY:-change-this-production-secret-key-123456789}"
      Admin__Username: "${ADMIN_USERNAME:-admin}"
      Admin__Password: "${ADMIN_PASSWORD:-Admin@123}"

    volumes:
      - leave_data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  leave_data: